plugins  {
    id 'com.android.application' version '8.5.2' apply false
}

android {
    namespace 'com.coinrushindia.prototype'
    compileSdk 35

    defaultConfig {
        applicationId 'com.coinrushindia.prototype'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
