plugins {
    id 'com.android.application'
}

android {
    namespace 'com.coinrushindia.prototype'

    compileSdk 35

    defaultConfig {
        applicationId 'com.coinrushindia.prototype'

        minSdk 23

        targetSdk 35

        versionCode 1

        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {

    implementation 'com.google.android.gms:play-services-ads:25.4.0'
}
