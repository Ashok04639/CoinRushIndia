plugins {
    id 'com.android.application' version '8.6.1'
}

android {
    namespace 'com.coinrushindia.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.coinrushindia.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
